	# Default: 1.0
	# Range: 0.0 ~ 3.0
	metalBlocksHitVolume = 1.0
	#Adjusts the volume of the main shrapnel projectiles when they hit or penetrate blocks.
	# Default: 1.5
	# Range: 0.0 ~ 3.0
	shrapnelHitVolume = 1.5
