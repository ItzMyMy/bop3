	# Default: 0.5
	# Range: 0.0 ~ 3.0
	debrisHitVolume = 0.5
	#Controls the volume of the whistling sound effect played when shrapnel flies closely past the player at high speed.
	# Default: 0.7
	# Range: 0.0 ~ 3.0
	shrapnelWhistleVolume = 0.7
