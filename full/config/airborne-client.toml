[visuals]
	#Scales how quickly local pollution becomes full murk (1.0 = match shared fog thresholds).
	# Default: 1.0
	# Range: 0.0 ~ 2.0
	fogStrength = 1.0
	#How hard interior smog crushes sky + fog toward midnight. 1.0 = coal-black night; block lights still shine.
	# Default: 1.0
	# Range: 0.0 ~ 1.5
	interiorMurk = 1.0
	#How far (in chunks) soft smog volumes are drawn. Independent of vanilla chunk render distance; raise with Distant Horizons.
	# Default: 80
	# Range: 16 ~ 160
	cloudRenderDistanceChunks = 80
