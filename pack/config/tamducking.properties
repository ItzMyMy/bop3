# True Adaptive Music ducking
# Music volume while ducked, 0.0 (silent) to 1.0 (no ducking)
duckVolume=0.2
# How long the fade down/up takes
fadeSeconds=1.5
# Duck while a jukebox or Create Harmonics record player is audible
duckForJukeboxes=true
# Stay ducked this long after the last audible record sound
jukeboxGraceSeconds=1.0
# Duck while a Create: Sound of Steam organ pipe is audible
duckForOrgans=true
# Stay ducked this long after the last organ note (covers rests between notes)
organGraceSeconds=10.0
