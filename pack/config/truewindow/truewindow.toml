[early_icon]
	#Path to the PNG icon for the splash screen. [default: icon.png]
	Early_Icon_Filename = "icon.png"

[general]
	#Automatically maximize the window on startup. [default: true]
	Always_Maximized = true
	#Custom title for the game window. Use %v for dynamic game version. [default: Minecraft %v]
	Window_Title = "Minecraft %v"

[high_quality_icon]
	#Switch to a high-quality icon after the game loads. (Windows only) [default: true]
	Enable_High_Quality_Icon = true
	#Path to the ICO icon for high-quality mode. [default: icon.ico]
	High_Quality_Icon_Filename = "icon.ico"
