#Better Combat Disabler Configuration
[general]
	#Default combat state on initial login (true = Better Combat, false = Vanilla)
	defaultState = false
	#If set to true, the hotkey will be disabled
	lockState = false
	#Forced combat state when lockState is true (true = Better Combat, false = Vanilla)
	lockedValue = false
	#Should custom weapon poses/animations be disabled when Better Combat is off? (true = disable, false = keep them)
	disableAnimations = true
