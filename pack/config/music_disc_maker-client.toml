#Playback volume multiplier for custom discs (relative to the Records sound slider).
# Default: 0.5
# Range: 0.0 ~ 1.0
volumeMultiplier = 0.5
#Maximum number of custom discs playing simultaneously (memory protection).
#0 = automatic (normally 64; reduced on devices with fewer audio sources). Recommended.
#Automatic mode keeps 8 streaming channels free for music, vanilla records, and ambience.
# Default: 0
# Range: 0 ~ 64
maxConcurrentDiscs = 0
#Distance in blocks at which custom disc audio fades to silence (vanilla discs use 16).
# Default: 64
# Range: 16 ~ 256
playbackRange = 64
#Upper cap for the Enhanced Jukebox per-block range setting (blocks). Effective range = min(block setting, this). Separate from playbackRange.
# Default: 256
# Range: 16 ~ 256
maxPlaybackRange = 256
#Distance in blocks at which a Boombox fades to silence.
#The Boombox is meant to be heard around you, not across a base - range and directional audio belong to the Golden Jukebox.
# Default: 16
# Range: 4 ~ 64
boomboxRange = 16
#Show "Now Playing" when a music disc starts, for every disc and every mod.
#Off by default: a custom disc whose video title could not be turned into a clean song name would show that title as it is.
showNowPlaying = false
#Show the album art in custom disc tooltips.
showAlbumArt = true
